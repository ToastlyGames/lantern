<style>
/*FONTFACE*/
:root{--ink:#1a1c2c;--deep:#0b0c14;--panel:#262b44;--panel2:#333c57;--line:#566c86;--text:#f4f4f4;--muted:#a9bdcc;--gold:#ffcd75;--ember:#ef7d57;--red:#b13e53;--green:#a7f070;--blue:#3b5dc9;--oil:#ffcd75;

.px{border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ink);background:var(--panel)}

.addf{display:flex;gap:6px;margin:4px 0 6px}.addf input{flex:1;min-width:0;background:#1a1c2c;border:1px solid #566c86;color:#f4f4f4;font:inherit;font-size:16px;padding:6px 8px;border-radius:2px}
#chatLog .pty b,#chatLog .pty i{color:#a7f070}#chatLog .pty i{font-style:normal;font-size:12px;border:1px solid #a7f070;padding:0 3px;margin-right:2px}
#feed.real{color:#ffcd75}

.note{color:#a7f070;margin:8px 0;font-size:15px}

#chatLog{flex:1;overflow-y:auto;padding:4px 8px;overscroll-behavior:contain}#chatLog p{margin:2px 0;line-height:1.25;word-wrap:break-word}#chatLog b{color:#94e0ff}#chatLog .me b{color:#ffcd75}#chatLog .sys{color:#a7b4c4;font-size:13px}
.chatRow{display:flex;gap:4px;padding:4px}#chatIn{flex:1;min-width:0;background:rgba(10,12,20,.55);border:1px solid rgba(148,176,194,.4);color:#f4f4f4;font:inherit;font-size:16px;padding:6px 8px;border-radius:2px}
#chatIn:focus{outline:2px solid #ffcd75;outline-offset:-1px}#chatIn::placeholder{color:#8a96a8}
.land #chat{top:calc(var(--st) + 64px);height:min(52vh,260px)}

@media (hover:hover) and (pointer:fine){#chatB{left:calc(50% + 142px);transform:none;bottom:calc(var(--sb) + 18px)}#chat{top:auto;bottom:calc(var(--sb) + 120px);height:min(40vh,320px)}}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(148,176,194,.15)}.setrow.col{flex-direction:column;align-items:stretch}
.setrow b{color:#ffcd75;margin-left:6px}.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.seg .btn{padding-left:2px;padding-right:2px;min-width:0}
.seg .btn[aria-pressed=true],.setrow .btn[aria-pressed=true]{background:#ffcd75;color:#1a1c2c}
#bright{width:100%;accent-color:#ffcd75;height:28px}.btn.warn{background:#b13e53;color:#f4f4f4}
#goldRun{margin-right:4px}
#feed{position:fixed;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);top:calc(var(--st) + 124px);font-size:17px;color:var(--muted);text-align:center;pointer-events:none;text-shadow:1px 1px 0 var(--ink);z-index:1}
#feed::before{content:"★ ";color:#ffcd75}#feed:empty{display:none}
.keyhint{display:none}
#guide{position:fixed;left:calc(var(--sl) + 10px);top:calc(var(--st) + 84px);max-width:min(330px,calc(100vw - 20px));z-index:2;color:#e3e9ef;font-family:inherit;font-size:17px;text-align:left;padding:6px 10px;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}

.goals{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:g}.goals li{background:var(--panel2);border:2px solid var(--ink);padding:8px 10px;display:grid;gap:2px;counter-increment:g}
.goals li b{font-size:20px;font-weight:400}.goals li b::before{content:counter(g) ". ";color:var(--muted)}.goals li.done{opacity:.6}.goals li.done b{text-decoration:line-through}.goals li.on{box-shadow:inset 0 0 0 2px var(--gold)}
.itemhd{display:flex;gap:12px;align-items:center;border-left:4px solid var(--rc,var(--line));padding-left:10px;margin-bottom:6px}.itemhd .big{width:64px;height:64px;image-rendering:pixelated;background:var(--ink);padding:8px}

#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:2}

.rb{position:relative;width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ink);color:var(--text);display:grid;place-items:center;padding:0;touch-action:none;cursor:pointer}

#retRing{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p,0)*360deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 30px,#000 31px);mask:radial-gradient(circle,transparent 30px,#000 31px);pointer-events:none}

.land #feed{top:calc(var(--st) + 10px);left:50%;right:auto;transform:translateX(-50%);max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

}
