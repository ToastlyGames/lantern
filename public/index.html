:root{--ink:#1a1c2c;--deep:#0b0c14;--panel:#262b44;--panel2:#333c57;--line:#566c86;--text:#f4f4f4;--muted:#a9bdcc;--gold:#ffcd75;--ember:#ef7d57;--red:#b13e53;--green:#a7f070;--blue:#3b5dc9;--oil:#ffcd75;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ctl:1;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{font-synthesis:none;letter-spacing:.02em;margin:0;height:100%;background:var(--deep);color:var(--text);overflow:hidden;font-family:"Jersey 10",ui-monospace,Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* no long-press image menu (share / copy / save) or text selection on game controls */
html,body,button,img,canvas,.rb,#side,#hud{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
img,canvas{-webkit-user-drag:none;user-drag:none}
button img,button canvas,button span{pointer-events:none}
input,textarea,#acctBody,.sel{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit;touch-action:manipulation}
/* game controls: a second finger (joystick + attack) must never become a pinch-zoom */
.rb,.qs,#pad,#side,#side button,#socB,#chatB,canvas{touch-action:none}
canvas.pt{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#tags{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:1}
/* name tags: only the name is centred on the hero (the box is the name), level and crown hang outside it */
.tag{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.tag b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.01em;color:#f2f5f8;background:rgba(20,22,34,.38);padding:2px 5px 2px;border-radius:7px;text-shadow:0 1px 1px rgba(10,12,20,.9),0 0 2px rgba(10,12,20,.8);-webkit-font-smoothing:antialiased}
/* chat over heads: just the words, a whisper of background, wrapping to at most 3 short lines */
.tag.say b{transform:translate(-50%,-100%);font:500 10.5px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:rgba(20,22,34,.14);padding:1px 4px;border-radius:5px;
  white-space:normal;width:max-content;max-width:150px;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 1px rgba(8,10,18,.95),0 0 3px rgba(8,10,18,.85),1px 0 1px rgba(8,10,18,.7),-1px 0 1px rgba(8,10,18,.7)}
.tag.hov b{color:#a7f070;background:rgba(12,14,24,.86);padding:3px 7px 3px;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tag.adm b{color:#ffe9a8}.tag.me b{color:#ffd98a}.tag.npc b{color:#a7f070;background:rgba(20,22,34,.5)}
.warnbox{background:#3a2a1c;border:2px solid #ef7d57;color:#f4e4c1;padding:10px 12px;margin:0 0 12px;font-size:17px;line-height:1.3}.warnbox b{color:#ffcd75}
.npchd{display:flex;gap:12px;align-items:center;margin:0 0 10px}.npchd img{width:78px;height:90px;image-rendering:pixelated;background:var(--ink);border:2px solid var(--line);padding:4px}
.npchd b{display:block;font-size:26px;color:var(--gold)}.npchd.wick img{border-color:#b98cff}.npchd.wick b{color:#d7bcff}.wickchk{animation:wk 1s steps(2) infinite}@keyframes wk{50%{opacity:.55}}.npchd small{display:block;color:var(--muted);font-size:15px}.npchd em{display:block;font-style:normal;margin-top:6px;font-size:17px;color:var(--text)}
.ca{background:var(--ink);border:2px solid var(--gold);box-shadow:inset 0 0 0 2px rgba(255,205,117,.15);padding:10px 12px;margin:4px 0 10px}.ca b{display:block;color:var(--gold);font-size:21px;margin-bottom:6px}
.ca small{display:block;color:var(--muted);font-size:15px;margin-top:6px;line-height:1.3}.ca small.ok{color:var(--green)}.ca small.warn{color:#e3d2bf}.ca.pending{border-color:var(--line)}.ca.pending b{color:var(--text)}
.caaddr{display:block;width:100%;text-align:center;font:600 15px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden;color:var(--text);background:var(--panel2);border:2px solid var(--line);padding:8px 6px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:default;touch-action:manipulation}
.ca.fnd{border-color:#b98cff;box-shadow:inset 0 0 0 2px rgba(185,140,255,.18)}.ca.fnd b{color:#d7bcff}.ca.fnd b small{display:inline;color:var(--muted);font-size:15px;margin:0 0 0 6px}.ca.fnd .btn{margin-top:8px}
.soon.fnd{border-color:#b98cff}.fchk{list-style:none;margin:8px 0 6px;padding:0}.fchk li{position:relative;padding-left:24px;font-size:17px;color:var(--muted);margin:3px 0}.fchk li::before{content:'';position:absolute;left:2px;top:5px;width:12px;height:12px;border:2px solid #566c86}.fchk li.ok{color:var(--text)}.fchk li.ok::before{background:#b98cff;border-color:#b98cff;box-shadow:inset 0 0 0 2px #1a1c2c}.fchk small{color:var(--muted)}.soon.fnd b{color:#d7bcff}.soon.fnd p{margin:6px 0 0;color:var(--muted);font-size:16px;line-height:1.3}.flamet{color:#d7bcff}
.fndart{display:flex;align-items:center;gap:14px;margin:4px 0 10px}.fndart img{width:120px;height:120px;image-rendering:pixelated;border:2px solid #b98cff;background:#0b0c14;flex:none}
.fndart span{display:flex;flex-direction:column}.fndart b{font-size:38px;color:#d7bcff;line-height:1}.fndart small{color:var(--muted);font-size:16px;margin-top:4px}
.ic.flameic{display:inline-block;background:radial-gradient(circle at 50% 60%,#f1e4ff 0 18%,#b98cff 19% 42%,rgba(185,140,255,.25) 43% 70%,transparent 71%)}
.caaddr:hover,.caaddr:focus-visible{border-color:var(--gold);outline:none}.caaddr:active{transform:translateY(1px)}
.buildv{display:flex;align-items:baseline;gap:10px;background:var(--ink);border:2px solid var(--line);padding:8px 12px;margin:4px 0 8px}.buildv b{font-size:30px;color:var(--gold)}.buildv span{color:var(--muted);font-size:15px}
.changelog section{background:var(--panel2);border:2px solid var(--ink);padding:8px 12px;margin:0 0 8px}.changelog section.latest{box-shadow:inset 0 0 0 2px var(--gold)}
.changelog h3{margin:0 0 4px;font-size:19px;color:var(--text)}.changelog h3 small{color:var(--muted);font-size:14px;margin-left:6px}.changelog ul{margin:0;padding-left:18px;font-size:16px;line-height:1.45}
.soon{background:var(--ink);border:2px solid var(--gold);padding:10px 14px;margin:8px 0}.soon b{color:var(--gold);font-size:20px}.soon ul{margin:6px 0 0;padding-left:18px;font-size:17px;line-height:1.5}
.tag i{position:absolute;top:0;transform:translate(0,-50%);font:700 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-style:normal;background:rgba(16,18,28,.55);padding:2px 3px;border-radius:4px;text-shadow:0 1px 1px rgba(10,12,20,.9)}
.tag .cr{position:absolute;top:0;width:12px;height:12px;image-rendering:pixelated;transform:translate(0,-50%)}
.px{border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ink);background:var(--panel)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px);display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:2}
.card{padding:6px 8px;border-radius:2px}
#vit{flex:1;max-width:290px;display:grid;gap:5px;position:relative;overflow:hidden}
/* XP: a thin strip along the bottom of the health card for the skill you're training */
#xpb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(10,12,20,.75)}
#xpb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);box-shadow:0 0 6px currentColor;transition:width .35s ease-out}
.land #guide.xp{max-width:min(230px,calc(50vw - 150px))}
#guide.xp::before{display:none}#guide.xp{white-space:nowrap}#guide.xp .ic{width:16px;height:16px;vertical-align:-3px;margin-right:5px;image-rendering:pixelated}
#guide.xp b{font-weight:600}#guide.xp small{color:#a9bdcc;font-size:.9em}
.skl.cur{box-shadow:inset 3px 0 0 var(--gold)}.skl .trn{color:#a7f070;font-size:.75em;margin-left:4px}
.xpm{display:inline-block;position:relative;width:46px;height:5px;background:var(--ink);margin:0 6px 1px;vertical-align:middle;box-shadow:0 0 0 1px rgba(86,108,134,.6)}.xpm i{position:absolute;left:0;top:0;bottom:0}
.top{display:flex;justify-content:space-between;gap:8px;font-size:18px;color:var(--muted)}.top span:first-child{color:var(--text);font-weight:600}
#where{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
#lvl{white-space:nowrap;flex:none}#where{min-width:0}#vit{grid-template-columns:minmax(0,1fr)}#vit .top{min-width:0}.goldv{flex:none;display:inline-flex;align-items:center;gap:3px;color:#ffcd75;white-space:nowrap}.goldv img{width:12px;height:12px;image-rendering:pixelated}.goldv b{font-weight:400}
.bar{position:relative;height:14px;background:var(--ink);border:1px solid var(--ink)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
#oilFill{background:var(--oil)}#oilFill.low{background:var(--ember);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.bar canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

.tabs{display:flex;gap:6px;margin:4px 0 10px}.tabs.gt{flex-wrap:wrap}.tabs.gt .tab{flex:1 1 30%;font-size:17px;padding:5px 6px;min-height:0}.tab{flex:1;font-size:20px;color:var(--muted);background:var(--ink);border:2px solid var(--ink);padding:8px;min-height:42px}
.tab[aria-selected=true]{color:var(--text);background:var(--panel2);box-shadow:inset 0 -3px 0 var(--gold)}
.loot{list-style:none;margin:0;padding:0;display:grid;gap:4px}.loot li{display:flex;gap:8px;align-items:center;font-size:21px}.loot li span{flex:1}.loot b{color:var(--gold)}
.kit{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:20px}.kit span{display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stats span{background:var(--ink);padding:6px;font-size:16px;color:var(--muted);display:grid}.stats b{font-size:21px;color:var(--text)}
.gears{display:grid;gap:6px}.gear,.hero{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--ink);padding:8px}.gear .ic,.hero .ic{width:36px;height:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}.cell{background:var(--ink);padding:6px 4px;display:grid;justify-items:center;gap:2px;text-align:center}.cell .ic{width:32px;height:32px}.cell b{font-size:20px;color:var(--gold)}.cell small{font-size:14px;line-height:1.1}
/* rarity, skills */
.gear{border-left:4px solid var(--rc,var(--ink))}.cell{box-shadow:inset 0 -3px 0 var(--rc,transparent)}
.rt{font-style:normal;font-weight:600;margin-left:4px}
.toast.rare{color:var(--gold);font-weight:700}.toast.r-uncommon{color:#a7f070}.toast.r-rare{color:#41a6f6}.toast.r-xrare{color:#c77dff}.toast.r-legendary{color:#ffcd75;box-shadow:inset 0 0 0 2px #ffcd75,0 0 18px rgba(255,205,117,.5)}
.skl{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--ink);padding:8px 10px;margin:6px 0}
.skl .ic{width:32px;height:32px}.skl>span{flex:1;display:grid;gap:4px}.skl b{font-size:21px}.skl b em{font-style:normal;color:var(--gold);font-size:26px;margin-left:4px}.skl b small{margin-left:2px}
.xpb{display:block;height:8px;background:var(--ink);position:relative}.xpb i{position:absolute;left:0;top:0;bottom:0}
.cookb{display:flex;gap:6px;margin-top:8px}.cookb .btn{flex:1}
.perks{margin-top:10px;display:grid;gap:8px}.perks p{margin:0;font-size:20px;line-height:1.35;color:#e3e9ef}.perks p.small{font-size:17px;color:var(--muted)}
.gear .btn{flex-shrink:0}
/* forge + admin */
.recipe.locked{opacity:.55}.lockt{color:#ff9a9a}
.btn.admin{background:linear-gradient(#3b5dc9,#29366f);box-shadow:inset 0 0 0 2px #73eff7}
.toast.r-mythic{color:#ff77a8;box-shadow:inset 0 0 0 2px #ff77a8,0 0 22px rgba(255,119,168,.6)}
.toast.r-unique{color:#73eff7;box-shadow:inset 0 0 0 2px #73eff7,0 0 18px rgba(115,239,247,.5)}
/* bank */
.unlocks{list-style:none;padding:0;margin:0;display:grid;gap:4px}.unlocks li{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--ink);padding:6px 10px;font-size:18px}
.unlocks li span{color:var(--muted);width:16px}.unlocks li b{flex:1;font-weight:400}.unlocks li em{font-style:normal;color:var(--gold)}.unlocks li.done{opacity:.65}.unlocks li.done span{color:var(--green)}
.lead.warn{color:#ffd29a}.link.inl{margin:0;padding:0 4px;min-height:0;font-size:inherit;color:var(--gold)}
/* farm */
.plots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 4px}
.plot{position:relative;background:#3d2a1e;border:2px solid var(--ink);padding:6px 2px 8px;display:grid;justify-items:center;gap:2px;min-height:54px;min-width:0}.plot small{font-size:11px;white-space:nowrap}
.plot.locked{background:#2a2622;opacity:.7}.plot.locked .pl{font-size:16px;line-height:26px;filter:grayscale(1)}
.plot .ic{width:26px;height:26px}.plot small{color:#e3d2bf}.plot.ready{box-shadow:inset 0 0 0 2px var(--green)}.plot.ready small{color:var(--green)}
.plot i{position:absolute;left:0;bottom:0;height:4px;background:var(--green)}
.plot.empty .pi{width:26px;height:26px;background:repeating-linear-gradient(0deg,#2b1d14 0 4px,#4a3324 4px 8px)}
.qty{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:21px}.qty span{flex:1;color:var(--muted)}
.qty output{min-width:40px;text-align:center;font-size:29px;font-weight:700;color:var(--gold)}
/* onboarding */
.pre #hud,.pre #ctl,.pre #feed,.pre .keyhint,.pre #guide{visibility:hidden}
#acct{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(circle at 50% 20%,rgba(58,40,30,.94),rgba(11,12,20,.97) 65%);padding:calc(var(--st) + 20px) calc(var(--sr) + 16px) calc(var(--sb) + 20px) calc(var(--sl) + 16px)}
#acctBody{width:100%;max-width:440px;margin:auto 0;text-align:center;user-select:text}
#acctBody h1{font-size:60px;line-height:1;margin:6px 0 6px;color:var(--gold);text-shadow:3px 3px 0 #7a2f3c,6px 6px 0 var(--ink)}
#acctBody h2{font-size:34px}
.logoHero{width:80px;height:80px;image-rendering:pixelated;display:block;margin:0 auto}
.tag{color:#e3e9ef;font-size:22px;line-height:1.4;margin:8px 0 18px}
#acctBody .btn{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}
#acctBody .btn.big{background:#a33c2f}
.wal img,.wi{width:22px;height:22px}
.wi{display:inline-block;background:linear-gradient(#ffcd75,#ef7d57);border:2px solid var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.gi{width:22px;height:22px;display:inline-grid;place-items:center;background:#f4f4f4;color:#3b5dc9;font-weight:700;font-size:20px;border:2px solid var(--ink)}
.goog em,.acctRow em{font-style:normal;font-size:16px;background:var(--ink);color:var(--muted);padding:2px 6px;margin-left:4px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:21px;margin-top:14px;padding:8px;cursor:pointer;min-height:40px}
.sub{color:var(--muted);font-size:18px;margin:6px 0 0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:17px;margin:18px 0 4px}.or::before,.or::after{content:"";flex:1;height:2px;background:var(--panel2)}
.err{color:#ffb0b0;background:rgba(177,62,83,.2);border:2px solid #7a2f3c;padding:8px 10px;font-size:20px;margin:12px 0 0;text-align:left}
.fine{font-size:17px;color:#8aa0b3;line-height:1.5;margin-top:16px}
.how{text-align:left;font-size:21px;line-height:1.5;margin:0 0 12px;padding-left:22px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px;counter-reset:s}
.steps li{flex:1;font-size:17px;color:#7f94a8;border-top:4px solid var(--panel2);padding-top:6px;counter-increment:s}
.steps li::before{content:counter(s) ". "}.steps li.done{color:var(--green);border-color:var(--green)}.steps li.on{color:var(--gold);border-color:var(--gold)}
.spin{width:28px;height:28px;margin:20px auto 12px;background:var(--gold);animation:spin 1s steps(4) infinite}@keyframes spin{to{transform:rotate(360deg)}}
.acctRow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-top:8px}
.acctRow span:nth-child(2){flex:1;display:grid;gap:2px}.acctRow b{font-size:21px}.acctRow i{font-style:normal;color:var(--green);font-size:26px}
.acctRow:not(.ok){opacity:.7}
.creator{display:grid;grid-template-columns:auto 1fr;gap:16px;text-align:left;margin-top:8px}
.pvWrap{display:grid;gap:8px;align-content:start;justify-items:center}
#pv{width:120px;height:120px;image-rendering:pixelated;background:radial-gradient(circle,#333c57,#1a1c2c 70%);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
#acctBody .pvWrap .btn{width:120px;margin:0}
.opts h3{margin:10px 0 6px}
.fld{display:grid;gap:4px}.fld span{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input{font:inherit;font-size:23px;color:var(--text);background:var(--ink);border:2px solid var(--line);padding:10px;min-height:46px;width:100%;user-select:text;touch-action:manipulation}
.fld small.good{color:var(--green)}.fld small.bad{color:#ff9a9a}.fld small.warn{color:var(--gold)}
.swrow{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:34px;background:var(--c);border:2px solid var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);cursor:pointer;padding:0}
.sw[aria-checked=true]{outline:3px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:20px;color:var(--text);background:var(--panel2);border:2px solid var(--ink);padding:6px 12px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);box-shadow:inset 0 0 0 2px var(--gold)}
@media (max-width:400px){.creator{grid-template-columns:1fr}.pvWrap{grid-auto-flow:column;align-items:center;justify-content:center}#pv{width:96px;height:96px}#acctBody .pvWrap .btn{width:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== touch devices: slim top bar, quick slots in an arc around Attack ===== */
@media (pointer:coarse){
  :root #hud{justify-content:center;padding:calc(var(--st) + 6px) calc(var(--sr) + 96px) 0 calc(var(--sl) + 96px)}
  :root #vit{flex:0 1 auto;width:min(380px,100%);max-width:none;display:flex;align-items:center;gap:6px;padding:4px 7px}
  :root #vit .top{flex:none;font-size:16px}:root #where{display:none}
  :root #vit>.bar{flex:1;height:12px}:root #oilRow{flex:1;font-size:13px;gap:4px}:root #oilRow .bar{height:12px}
  :root #side{position:fixed;right:calc(var(--sr) + 8px);top:calc(var(--st) + 6px)}
  :root #goldC{min-height:30px;padding:3px 7px}
  :root #guide{left:50%;right:auto;top:calc(var(--st) + 44px);transform:translateX(-50%);font-size:15px;padding:3px 9px;max-width:min(320px,calc(100vw - 24px))}
  :root #wildB{left:50%;right:auto;top:calc(var(--st) + 44px);transform:translateX(-50%);font-size:15px;padding:3px 9px}
  :root #feed{top:calc(var(--st) + 74px)}
  :root .toast{top:calc(var(--st) + 100px)}
  .land #guide{left:calc(var(--sl) + 8px);transform:none;top:calc(var(--st) + 6px);max-width:120px}
  .land #wildB{left:calc(var(--sl) + 8px);right:auto;transform:none;top:calc(var(--st) + 6px);font-size:14px}
  .land #feed{top:calc(var(--st) + 44px)}
  .land .toast{top:calc(var(--st) + 48px)}
  /* action cluster: Attack in the corner, 5 quick slots on an arc, flame and bag outside it */
  :root #acts{position:relative;display:block;width:80px;height:80px}
  :root #bA{position:absolute;left:0;top:0;width:80px;height:80px}
  :root #quick{position:absolute;left:40px;top:40px;transform:none;bottom:auto;display:block;width:0;height:0}
  :root #quick .qs{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%}
  :root #quick .qs i{left:50%;top:-14px;transform:translateX(-50%);font-size:12px;text-shadow:1px 1px 0 var(--ink)}
  :root #quick .qs:nth-child(1){transform:translate(-100px,0)}
  :root #quick .qs:nth-child(2){transform:translate(-92px,-38px)}
  :root #quick .qs:nth-child(3){transform:translate(-71px,-71px)}
  :root #quick .qs:nth-child(4){transform:translate(-38px,-92px)}
  :root #quick .qs:nth-child(5){transform:translate(0,-100px)}
  :root #quick .qs:active{filter:brightness(1.3)}
  :root #bRet{position:absolute;left:calc(40px - 168px - 24px);top:calc(40px - 24px);width:48px;height:48px}
  :root #mini{position:absolute;left:16px;bottom:184px;top:auto;display:flex;flex-direction:column;align-items:center;gap:7px;width:48px}
  .land :root #mini,.land #mini{gap:5px}.land .rb.sm{width:38px;height:38px}
  :root #bBag{width:48px;height:48px}
  .short #acts{transform:scale(.88);transform-origin:100% 100%}
  /* upright phones: the bottom row is full (joystick, quick slots, Attack), so the Return Flame sits just above the
     joystick under your left thumb, and the chat button moves up to the left edge */
  /* phones held sideways: the joystick sits higher, where a thumb rests naturally */
  .land #pad{margin-bottom:clamp(28px,13vh,64px)}
  :root:not(.land) #bRet{position:fixed;left:calc(var(--sl) + 56px);top:auto;bottom:calc(var(--sb) + 168px)}
  :root:not(.land) #chatB{left:calc(var(--sl) + 12px);transform:none;bottom:auto;top:calc(var(--st) + 92px)}
}

<canvas id="cv"></canvas>
<div id="tags" aria-hidden="true"></div>
<div id="hud">

  <div id="side"><div class="sidetop"><button id="compass" class="px card" aria-label="Compass: north is up. The Wilderness lies north."><i class="cn">N</i><i class="ce">E</i><i class="cs">S</i><i class="cw">W</i><b></b></button><button id="setB" class="px card" aria-label="Settings"><img id="setIc" alt=""></button></div><button id="socB" class="px card" aria-label="Social: friends and party"><img id="socIc" alt=""><span class="badge" id="socN" hidden></span></button></div>
</div>

<div id="feed"></div>
<div class="keyhint"><kbd>WASD</kbd> move · <kbd>Space</kbd>/<kbd>Click</kbd> attack · <kbd>Scroll</kbd> zoom<br><kbd>B</kbd> bag · <kbd>H</kbd> hero · <kbd>K</kbd> skills · <kbd>1</kbd>–<kbd>5</kbd> quick · hold <kbd>R</kbd> return</div>

      <button class="rb sm" id="bHero" aria-label="Hero"><img id="icHero" alt=""></button>
      <button class="rb sm" id="bSkill" aria-label="Skills"><img id="icSkill" alt=""></button>

  </div>
</div>

  <div id="chatLog" aria-live="polite"></div>

<div id="acct"><div id="acctBody"></div></div>
